[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "rl2048"
version = "0.1.0"
description = "RL agents for 2048 (DQN baseline, per Saligram et al. 2025)"
requires-python = ">=3.9"
dependencies = [
    "gymnasium-2048",
    "numpy",
    "torch",
    "pandas",
    "matplotlib",
]

[tool.setuptools]
packages = ["rl2048"]
